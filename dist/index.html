<style>
/* ============================================================
   JPX PROJECT — NEO DARK (terinspirasi master.commandcenter)
   Window macOS dots · background foto · semua ikon sosial
   ============================================================ */
:root{
  --bg:#141418;
  --card:#1c1c22;              /* neo-bg */
  --card-border:rgba(255,255,255,.08);
  --panel:#232329;
  --panel-border:rgba(255,255,255,.05);
  --text:#d0d0d8;
  --text-bright:#f0f0f5;
  --text-dim:#6a6a78;
  --accent:#3dff8b;            /* aksen hijau neo */
  --accent-soft:rgba(61,255,139,.12);
  --red:#ff5f57;
  --yellow:#febc2e;
  --green:#28c840;
  --r-xl:16px;
  --r-lg:14px;
  --r-md:10px;
  --shadow-card:0 24px 60px -12px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.03) inset;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{min-height:100%}

body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--text);
  background:var(--bg);
  min-height:100dvh;
  display:grid;
  place-items:center;
  overflow-x:hidden;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
}

/* ---------- 1. BACKGROUND (foto harus terlihat) ---------- */
.bg-photo{
  position:fixed;inset:-4%;z-index:-3;
  background-size:cover;background-position:center;
  filter:blur(16px) saturate(1.05) brightness(.48);
  opacity:0;
  transition:opacity 1.2s ease;
  pointer-events:none;
}
.bg-photo::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,20,24,.45),rgba(20,20,24,.82));
}
body.has-photo .bg-photo{opacity:1}

.bg-scene{position:fixed;inset:0;z-index:-2;overflow:hidden}
.bg-glow{
  position:absolute;width:120vmax;height:120vmax;left:50%;top:50%;
  transform:translate(-50%,-50%);
  background:
    radial-gradient(circle at 25% 30%,rgba(61,255,139,.10),transparent 40%),
    radial-gradient(circle at 80% 20%,rgba(40,200,64,.07),transparent 38%),
    radial-gradient(circle at 65% 85%,rgba(120,120,140,.08),transparent 42%);
  filter:blur(60px);
}
.bg-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,transparent 40%,rgba(0,0,0,.5) 100%)}

/* ---------- 2. KARTU / WINDOW ---------- */
.card{
  position:relative;
  width:100%;max-width:440px;
  background:rgba(26,26,32,.60);
  -webkit-backdrop-filter:blur(22px) saturate(1.3);
  backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(255,255,255,.09);
  border-radius:var(--r-xl);
  box-shadow:var(--shadow-card);
  overflow:hidden;
  animation:cardIn .8s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Window bar ala macOS */
.win-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  background:rgba(255,255,255,.02);
  border-bottom:1px solid rgba(255,255,255,.05);
  user-select:none;
}
.win-dots{display:flex;gap:8px}
.win-dots span{width:12px;height:12px;border-radius:50%;display:block;flex-shrink:0}
.d-red{background:var(--red);box-shadow:0 0 6px rgba(255,95,87,.55)}
.d-yellow{background:var(--yellow);box-shadow:0 0 6px rgba(254,188,46,.55)}
.d-green{background:var(--green);box-shadow:0 0 6px rgba(40,200,64,.55)}
.win-title{
  flex:1;text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:.72rem;color:var(--text-dim);
  letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.win-title b{color:var(--accent);font-weight:600}

/* ---------- 3. HEADER ---------- */
.header{position:relative;padding:28px 22px 6px;text-align:center}

.avatar-wrap{position:relative;width:96px;height:96px;margin:0 auto}
.avatar-ring{
  position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(61,255,139,.4);
  box-shadow:0 0 20px rgba(61,255,139,.18),0 0 0 5px rgba(255,255,255,.02);
}
.avatar{
  position:absolute;inset:0;border-radius:50%;
  background:#16161b;
  display:grid;place-items:center;overflow:hidden;
  border:3px solid var(--card);
}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:58%;height:58%}
.status-dot{
  position:absolute;right:4px;bottom:4px;
  width:16px;height:16px;border-radius:50%;
  background:var(--green);border:3px solid var(--card);
  z-index:3;animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(40,200,64,.5),0 0 10px rgba(40,200,64,.8)}
  50%{box-shadow:0 0 0 8px rgba(40,200,64,0),0 0 10px rgba(40,200,64,.8)}
}

.name{
  margin-top:16px;
  font-family:"Space Grotesk",sans-serif;
  font-size:clamp(1.4rem,6vw,1.7rem);
  font-weight:700;letter-spacing:-.02em;
  color:var(--text-bright);
}
.role-chip{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:10px;padding:5px 13px;
  font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--text);
  background:rgba(255,255,255,.05);
  border:1px solid var(--panel-border);
  border-radius:999px;
}
.role-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}

.tags{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;margin-top:14px}
.tag{display:inline-flex;align-items:center;gap:8px;font-size:.76rem;color:var(--text-dim);letter-spacing:.03em;font-weight:400}
.tag i{font-style:normal;font-size:.32rem;color:var(--accent);opacity:.85}
.prompt-line{
  display:flex;justify-content:center;align-items:center;gap:6px;
  margin-top:12px;
  font-family:'JetBrains Mono',monospace;font-size:.74rem;color:var(--text-dim);
}
.prompt-line .prompt-text{color:var(--accent);font-weight:600}
.cursor{display:inline-block;width:7px;height:1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1s step-end infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}
.bio{margin-top:10px;font-size:.84rem;line-height:1.6;color:var(--text-dim)}
.bio[hidden]{display:none}

/* ---------- 4. TERMINAL ---------- */
.terminal-section{padding:16px 20px 0}
.terminal-box{
  background:#16161b;
  border:1px solid var(--panel-border);
  border-radius:var(--r-lg);
  overflow:hidden;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.6);
}
.terminal-header{
  display:flex;align-items:center;gap:8px;
  padding:.5rem .8rem;
  background:rgba(255,255,255,.03);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.terminal-dots{display:flex;gap:6px}
.terminal-dots span{width:11px;height:11px;border-radius:50%}
.terminal-dots span:nth-child(1){background:var(--red)}
.terminal-dots span:nth-child(2){background:var(--yellow)}
.terminal-dots span:nth-child(3){background:var(--green)}
.terminal-title{font-size:.68rem;color:#5A6A7A;font-family:'JetBrains Mono',monospace}
.terminal-title span{color:var(--green)}
.terminal-body{
  padding:.7rem 1rem;min-height:110px;max-height:170px;overflow-y:auto;
  font-family:'JetBrains Mono',monospace;font-size:.7rem;line-height:1.55;
  color:#B0C4DE;background:#16161b;
}
.terminal-body::-webkit-scrollbar{width:4px}
.terminal-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px}
.terminal-line{display:flex;align-items:baseline;flex-wrap:wrap;min-height:1.35rem;padding:.02rem 0;white-space:pre-wrap;word-break:break-word}
.terminal-prompt{color:var(--green);font-weight:600;margin-right:.5rem;flex-shrink:0}
.terminal-cmd{color:#E6EDF3}
.terminal-output{color:#8B9EB0;padding-left:.2rem}
.terminal-output.green{color:#3FB950}
.terminal-output.cyan{color:#58A6FF}
.terminal-output.yellow{color:#D29922}
.terminal-output.dim{color:#57606a}
.terminal-cursor{display:inline-block;width:7px;height:.95rem;background:var(--green);margin-left:2px;vertical-align:text-bottom;animation:blink 1s step-end infinite;border-radius:2px}
.terminal-footer{
  display:flex;justify-content:space-between;align-items:center;
  padding:.3rem .8rem;
  border-top:1px solid rgba(255,255,255,.04);
  font-size:.55rem;color:#3D4A57;
  font-family:'JetBrains Mono',monospace;
  background:rgba(255,255,255,.01);
}
.terminal-status{display:flex;align-items:center;gap:.5rem}
.terminal-status span{display:flex;align-items:center;gap:.25rem}
.terminal-status .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.dot.green{background:#3FB950}
.dot.yellow{background:#D29922}

/* ---------- 5. LINKS ---------- */
.links{padding:18px 20px 0;display:flex;flex-direction:column;gap:11px}
.link-btn{
  position:relative;display:flex;align-items:center;gap:12px;
  width:100%;min-height:56px;padding:10px 14px;
  border-radius:var(--r-md);
  background:rgba(255,255,255,.04);
  border:1px solid var(--panel-border);
  color:var(--text);
  text-decoration:none;
  overflow:hidden;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .25s,border-color .25s,box-shadow .25s;
}
.link-btn:hover{
  background:rgba(255,255,255,.07);
  border-color:rgba(61,255,139,.45);
  transform:translateY(-2px);
  box-shadow:0 12px 28px -12px rgba(0,0,0,.6);
}
.link-btn:active{transform:scale(.97)}
.lb-icon{
  width:38px;height:38px;flex-shrink:0;
  display:grid;place-items:center;
  border-radius:var(--r-md);
  background:rgba(255,255,255,.04);
  border:1px solid var(--panel-border);
  color:var(--text-bright);
}
.lb-icon svg{width:19px;height:19px}
.lb-icon .emoji{font-size:1rem;line-height:1}
.lb-text{flex:1;text-align:left;min-width:0}
.lb-title{display:block;font-weight:600;font-size:.92rem;color:var(--text-bright)}
.lb-sub{display:block;margin-top:2px;font-size:.72rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-arrow{flex-shrink:0;color:var(--text-dim);opacity:.55;transition:transform .25s,opacity .25s,color .25s}
.link-btn:hover .lb-arrow{transform:translateX(4px);opacity:1;color:var(--accent)}
.lb-count{
  flex-shrink:0;display:none;align-items:center;gap:4px;
  padding:4px 9px;font-size:.66rem;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--text-bright);
  background:rgba(255,255,255,.06);
  border:1px solid var(--panel-border);
  border-radius:999px;white-space:nowrap;
}
.lb-count.show{display:inline-flex}
.lb-count.bump .lb-count-num{animation:countPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes countPop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.link-btn.featured{
  min-height:64px;
  background:linear-gradient(135deg,rgba(61,255,139,.12),rgba(61,255,139,.02));
  border:1px solid rgba(61,255,139,.32);
  box-shadow:0 12px 30px -14px rgba(0,0,0,.5);
}
.link-btn.featured .lb-title{font-size:.98rem;color:#fff}
.link-btn.featured .lb-sub{color:rgba(240,240,245,.72)}
.link-btn.featured .lb-icon{background:rgba(61,255,139,.1);border-color:rgba(61,255,139,.25)}
.link-btn.featured:hover{background:linear-gradient(135deg,rgba(61,255,139,.2),rgba(61,255,139,.05));box-shadow:0 16px 34px -14px rgba(61,255,139,.25);border-color:rgba(61,255,139,.5)}
.lb-badge{
  position:absolute;top:-9px;right:12px;z-index:2;
  padding:3px 9px;font-size:.55rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);
  background:rgba(18,18,24,.8);
  border:1px solid rgba(61,255,139,.35);
  border-radius:999px;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
}

/* ---------- 6. SOSIAL (semua platform, tanpa URL dulu) ---------- */
.socials{padding:18px 20px 0}
.socials-label{
  text-align:center;font-size:.64rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;
}
.socials-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
}
.social-btn{
  position:relative;
  height:52px;
  display:grid;place-items:center;
  border-radius:var(--r-md);
  color:var(--text);
  background:rgba(255,255,255,.04);
  border:1px dashed var(--panel-border);   /* dashed = placeholder (belum ada URL) */
  text-decoration:none;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),background .25s,border-color .25s,color .25s,opacity .25s;
  cursor:default;
}
.social-btn svg{width:21px;height:21px;fill:currentColor}
.social-btn .soon{
  position:absolute;top:-6px;right:-6px;
  width:8px;height:8px;border-radius:50%;
  background:var(--yellow);border:2px solid var(--card);
  opacity:.9;
}
.social-btn:hover{
  background:rgba(255,255,255,.08);
  border-color:rgba(61,255,139,.5);
  transform:translateY(-3px);
  color:var(--text-bright);
}
.social-btn:active{transform:scale(.92)}

/* ---------- 7. FOOTER ---------- */
.foot{
  padding:16px 20px 18px;text-align:center;
  font-size:.7rem;color:var(--text-dim);letter-spacing:.03em;
}
.foot .online{display:inline-flex;align-items:center;gap:5px;margin-bottom:6px;font-family:'JetBrains Mono',monospace;font-size:.64rem}
.foot .online i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.4s infinite;font-style:normal}
.foot .clicks{display:inline-block;margin-top:4px;color:var(--text-dim)}
.foot #resetClicks{
  margin-left:6px;background:none;border:none;
  color:var(--text-dim);font-size:.62rem;font-family:inherit;
  text-decoration:underline;cursor:pointer;transition:color .2s;
}
.foot #resetClicks:hover{color:var(--red)}

@media(max-width:360px){
  .links{padding:14px 14px 0}.header{padding:24px 14px 6px}
  .socials{padding:14px 14px 0}.terminal-section{padding:12px 14px 0}
  .socials-grid{grid-template-columns:repeat(4,1fr);gap:8px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important}
}
</style>
</head>

/* ====================== APLIKASI ====================== */
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }

  /* --- Tagline & prompt --- */
  var tagsEl = $('#tagsEl');
  var promptEl = $('#promptEl');
  function renderHeader() {
    var n = $('#nameEl'); if (n) n.textContent = PAGE_NAME;
    var r = $('#roleEl'); if (r) r.textContent = PAGE_ROLE;
    tagsEl.innerHTML = '';
    TAGS.forEach(function (t) {
      var pill = document.createElement('span');
      pill.className = 'tag';
      pill.innerHTML = '<i>✦</i> ' + esc(t);
      tagsEl.appendChild(pill);
    });
    promptEl.textContent = PROMPT;
    var bioEl = $('#bioEl');
    if (bioEl) {
      if (PAGE_BIO) { bioEl.textContent = PAGE_BIO; bioEl.hidden = false; }
      else bioEl.hidden = true;
    }
    var winEl = $('#winTitleEl');
    if (winEl) {
      var at = WIN_TITLE.indexOf('@');
      winEl.innerHTML = at > 0 ? '<b>' + esc(WIN_TITLE.slice(0, at)) + '</b>' + esc(WIN_TITLE.slice(at)) : esc(WIN_TITLE);
    }
    var fEl = $('#footTextEl');
    if (fEl) fEl.textContent = FOOT_TEXT;
  }

  /* --- Meta tags ikut domain & nama (siteUrl dari admin) --- */
  function applySiteMeta() {
    var base = (SITE_URL || '').replace(/\/+$/, '');
    if (!base) return;
    var set = function (sel, attr, val) { var el = document.querySelector(sel); if (el) el.setAttribute(attr, val); };
    set('link[rel="canonical"]', 'href', base + '/');
    set('meta[property="og:url"]', 'content', base + '/');
    set('link[rel="icon"]', 'href', base + '/avatar.jpg');
    set('meta[property="og:image"]', 'content', base + '/og-image.png');
    set('meta[name="twitter:image"]', 'content', base + '/og-image.png');
    var title = PAGE_NAME ? PAGE_NAME + ' · Semua Link' : document.title;
    document.title = title;
    set('meta[property="og:title"]', 'content', title);
    set('meta[name="twitter:title"]', 'content', title);
  }

  /* --- Links (dengan hitung klik) --- */
  var list = $('#linkList');
  function renderLinks() {
    list.innerHTML = '';
    LINKS.forEach(function (l) {
      var a = document.createElement('a');
      a.className = 'link-btn' + (l.featured ? ' featured' : '');
      a.href = safeUrl(l.url);
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      var iconHtml = '<span class="lb-icon">' + (ICONS[l.icon] || '<span class="emoji">🔗</span>') + '</span>';
      a.innerHTML =
        (l.badge ? '<span class="lb-badge">' + esc(l.badge) + '</span>' : '') +
        iconHtml +
        '<span class="lb-text"><span class="lb-title">' + esc(l.title) + '</span>' +
        (l.sub ? '<span class="lb-sub">' + esc(l.sub) + '</span>' : '') +
        '</span>' +
        '<span class="lb-arrow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>';
      var badge = document.createElement('span');
      badge.className = 'lb-count';
      badge.innerHTML = '👆 <span class="lb-count-num">0</span>';
      a.appendChild(badge);
      var key = (a.dataset.key = l.url || l.title);
      var update = function () {
        var n = shown(key);
        badge.querySelector('.lb-count-num').textContent = n.toLocaleString();
        badge.classList.toggle('show', n > 0);
      };
      var bump = function () {
        badge.classList.remove('bump');
        void badge.offsetWidth;
        badge.classList.add('bump');
      };
      a.addEventListener('click', function () {
        localAdd[key] = (localAdd[key] || 0) + 1;
        saveLocal(); update(); bump(); refreshTotal();
        if (CLICKS_API) {
          fetch(CLICKS_API + '/api/click', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: key })
          }).then(function (r) { return r.json(); }).then(function (d) {
            if (d && typeof d.count === 'number') {
              serverCounts[key] = d.count;
              delete localAdd[key];
              saveLocal(); update(); refreshTotal();
            }
          }).catch(function () {});
        }
      });
      update();
      list.appendChild(a);
    });
  }

  /* --- Sosial: aktif kalau URL diisi, placeholder kalau kosong --- */
  var socialGrid = $('#socialList');
  function renderSocials() {
    socialGrid.innerHTML = '';
    SOCIALS.forEach(function (s) {
      var label = s.label || s.icon;
      if (s.url) {
        var a = document.createElement('a');
        a.className = 'social-btn';
        a.href = safeUrl(s.url);
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = label;
        a.setAttribute('aria-label', label);
        a.innerHTML = (ICONS[s.icon] || '');
        socialGrid.appendChild(a);
      } else {
        var el = document.createElement('span');
        el.className = 'social-btn';
        el.title = label + ' — URL belum diisi';
        el.setAttribute('aria-label', label);
        el.innerHTML = (ICONS[s.icon] || '') + '<span class="soon"></span>';
        socialGrid.appendChild(el);
      }
    });
  }

  /* --- Penghitung klik global --- */
  var totalEl = $('#totalClicks');
  var serverCounts = {};
  var localAdd = loadLocal();

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(localAdd)); } catch (e) {}
  }
  function shown(key) { return (serverCounts[key] || 0) + (localAdd[key] || 0); }
  function refreshTotal() {
    var sum = 0;
    Object.keys(serverCounts).forEach(function (k) { sum += shown(k); });
    if (totalEl) totalEl.textContent = sum.toLocaleString();
  }

  function syncBadges() {
    document.querySelectorAll('.link-btn').forEach(function (a) {
      var k = a.dataset.key || a.getAttribute('href') || a.textContent;
      var n = shown(k);
      var num = a.querySelector('.lb-count-num');
      if (num) num.textContent = n.toLocaleString();
      var c = a.querySelector('.lb-count');
      if (c) c.classList.toggle('show', n > 0);
    });
    refreshTotal();
  }

  /* --- Render awal --- */
  renderHeader();
  renderLinks();
  renderSocials();
  applySiteMeta();
  refreshTotal();
  if (CLICKS_API) {
    fetch(CLICKS_API + '/api/clicks').then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.counts) {
        Object.assign(serverCounts, d.counts);
        syncBadges();
      }
    }).catch(function () {});
  }

  var resetBtn = $('#resetClicks');
  if (resetBtn) {
    resetBtn.addEventListener('click', function () {
      try { localStorage.removeItem(LOCAL_KEY); } catch (e) {}
      Object.keys(localAdd).forEach(function (k) { delete localAdd[k]; });
      document.querySelectorAll('.lb-count').forEach(function (b) {
        b.classList.remove('bump');
        var num = b.querySelector('.lb-count-num');
        if (num) num.textContent = '0';
      });
      refreshTotal();
      if (CLICKS_API) {
        fetch(CLICKS_API + '/api/clicks').then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.counts) {
            Object.assign(serverCounts, d.counts);
            syncBadges();
          }
        }).catch(function () {});
      }
    });
  }

  /* --- Avatar & background foto --- */
  var avatarImg = $('#avatarImg');
  function applyAvatar(i) {
    i = i || 0;
    if (i >= AVATAR_CANDIDATES.length) return;
    var img = new Image();
    img.onload = function () { avatarImg.src = AVATAR_CANDIDATES[i]; };
    img.onerror = function () { applyAvatar(i + 1); };
    img.src = AVATAR_CANDIDATES[i];
  }
  function applyBg(i) {
    i = i || 0;
    if (i >= BG_CANDIDATES.length) return;
    var img = new Image();
    img.onload = function () {
      $('#bgPhoto').style.backgroundImage = 'url("' + BG_CANDIDATES[i] + '")';
      document.body.classList.add('has-photo');
    };
    img.onerror = function () { applyBg(i + 1); };
    img.src = BG_CANDIDATES[i];
  }
  function applyColors(c) {
    if (!c) return;
    var st = document.documentElement.style;
    if (c.background) st.setProperty('--bg', c.background);
    if (c.primary) st.setProperty('--accent', c.primary);
    if (c.text) st.setProperty('--text', c.text);
    if (c.accent) st.setProperty('--text-bright', c.accent);
  }
  applyAvatar(0);
  applyBg(0);

  /* ====================== KONFIGURASI WEBSITE (satu sumber: admin) ======================
     Website memakai config yang dikelola admin (worker /api/config atau postMessage
     dari Live Preview di admin). Kalau tidak ada data, default di atas yang dipakai. */
  function applySiteConfig(cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    if (typeof cfg.name === 'string' && cfg.name) PAGE_NAME = cfg.name;
    if (typeof cfg.role === 'string' && cfg.role) PAGE_ROLE = cfg.role;
    if (typeof cfg.bio === 'string') PAGE_BIO = cfg.bio;
    if (typeof cfg.prompt === 'string' && cfg.prompt) PROMPT = cfg.prompt;
    if (typeof cfg.siteUrl === 'string' && cfg.siteUrl) SITE_URL = cfg.siteUrl;
    if (typeof cfg.windowTitle === 'string' && cfg.windowTitle) WIN_TITLE = cfg.windowTitle;
    if (typeof cfg.footText === 'string' && cfg.footText) FOOT_TEXT = cfg.footText;
    if (Array.isArray(cfg.terminal)) TERMINAL = cfg.terminal;
    if (Array.isArray(cfg.taglines)) TAGS = cfg.taglines;
    if (Array.isArray(cfg.links)) LINKS = cfg.links;
    if (Array.isArray(cfg.socials)) SOCIALS = cfg.socials;
    if (Array.isArray(cfg.photoAvatar) && cfg.photoAvatar.length) AVATAR_CANDIDATES = cfg.photoAvatar;
    if (Array.isArray(cfg.photoBg) && cfg.photoBg.length) BG_CANDIDATES = cfg.photoBg;
    if (typeof cfg.clicksApi === 'string' && cfg.clicksApi) CLICKS_API = cfg.clicksApi;
    applyColors(cfg.colors);
    renderHeader();
    renderLinks();
    renderSocials();
    applySiteMeta();
    applyAvatar(0);
    applyBg(0);
    if (window.__restartTerminal) window.__restartTerminal();
  }
  window.__applySiteConfig = applySiteConfig;

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (d && d.type === 'JPX_PREVIEW_CONFIG' && typeof window.__applySiteConfig === 'function') {
      window.__applySiteConfig(d.config);
    }
  });

  /* --- Ambil config dari server (yang disimpan admin) → website ikut tersinkron --- */
  function loadServerConfig() {
    if (!CLICKS_API) return;
    var controller = null;
    try { controller = new AbortController(); } catch (e) {}
    var timer = setTimeout(function () { if (controller) controller.abort(); }, 3500);
    fetch(CLICKS_API + '/api/config', controller ? { signal: controller.signal } : {})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.config && typeof d.config === 'object') applySiteConfig(d.config);
      })
      .catch(function () {})
      .then(function () { clearTimeout(timer); });
  }
  loadServerConfig();

  /* ====================== ANIMASI TERMINAL ====================== */
  var body = $('#terminalBody');
  var lineIdx = 0, charIdx = 0, isTyping = false;
  var curLineEl = null, curText = '', curType = '', curClass = '';
  var delayTimer = null;
  var OUT_DELAY = 25, PROMPT_DELAY = 60;

  function typeLine(data) {
    var line = document.createElement('div');
    line.className = 'terminal-line';
    curLineEl = line;
    curType = data.type;
    curClass = data.className || '';
    var promptText = '', cmdText = '';
    if (data.type === 'prompt') {
      var parts = data.text.split('$ ');
      if (parts.length === 2) { promptText = parts[0] + '$ '; cmdText = parts[1] || ''; }
      else { promptText = data.text; }
    }
    if (data.type === 'prompt') {
      var p = document.createElement('span');
      p.className = 'terminal-prompt';
      p.textContent = promptText;
      var c = document.createElement('span');
      c.className = 'terminal-cmd';
      c.textContent = '';
      line.appendChild(p); line.appendChild(c);
      line.appendChild(cursorEl());
      curText = cmdText;
    } else if (data.type === 'output') {
      var o = document.createElement('span');
      o.className = 'terminal-output' + (data.className ? ' ' + data.className : '');
      o.textContent = '';
      line.appendChild(o);
      line.appendChild(cursorEl());
      curText = data.text;
    }
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
    charIdx = 0;
    isTyping = true;
    typeNextChar();
  }
  function cursorEl() {
    var s = document.createElement('span');
    s.className = 'terminal-cursor';
    return s;
  }
  function typeNextChar() {
    if (!isTyping) return;
    var line = curLineEl;
    if (!line) { finishLine(); return; }
    var target = null;
    if (curType === 'prompt') target = line.querySelector('.terminal-cmd');
    else if (curType === 'output') target = line.querySelector('.terminal-output');
    if (!target) { finishLine(); return; }
    if (charIdx < curText.length) {
      target.textContent += curText.charAt(charIdx);
      charIdx++;
      var delay = (curType === 'prompt') ? PROMPT_DELAY : OUT_DELAY;
      delayTimer = setTimeout(typeNextChar, delay);
    } else {
      finishLine();
    }
  }
  function finishLine() {
    isTyping = false;
    if (curLineEl) {
      var cur = curLineEl.querySelector('.terminal-cursor');
      if (cur) cur.remove();
    }
    curLineEl = null;
    var data = TERMINAL[lineIdx];
    var pause = (data && data.delay) ? data.delay : 300;
    delayTimer = setTimeout(function () {
      if (lineIdx >= TERMINAL.length) {
        setTimeout(startTerminal, 2000);
      } else {
        processNextLine();
      }
    }, pause);
  }
  function processNextLine() {
    if (lineIdx >= TERMINAL.length) { addFinalCursor(); return; }
    var data = TERMINAL[lineIdx];
    lineIdx++;
    if (data.type === 'output' && data.text === '') {
      var empty = document.createElement('div');
      empty.className = 'terminal-line';
      empty.innerHTML = '&nbsp;';
      body.appendChild(empty);
      body.scrollTop = body.scrollHeight;
      delayTimer = setTimeout(processNextLine, 200);
      return;
    }
    if (data.type === 'prompt' && data.isFinal) {
      var line = document.createElement('div');
      line.className = 'terminal-line';
      var p = document.createElement('span');
      p.className = 'terminal-prompt';
      p.textContent = data.text;
      line.appendChild(p);
      body.appendChild(line);
      body.scrollTop = body.scrollHeight;
      delayTimer = setTimeout(addFinalCursor, 600);
      return;
    }
    typeLine(data);
  }
  function addFinalCursor() {
    var line = document.createElement('div');
    line.className = 'terminal-line';
    var p = document.createElement('span');
    p.className = 'terminal-prompt';
    p.textContent = TERMINAL_PROMPT;
    line.appendChild(p);
    line.appendChild(cursorEl());
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
  }
  function startTerminal() {
    if (!body) return;
    body.innerHTML = '';
    lineIdx = 0; charIdx = 0; isTyping = false;
    if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
    delayTimer = setTimeout(processNextLine, 500);
  }
  document.querySelector('.terminal-box').addEventListener('click', function (e) {
    if (e.target.closest('.terminal-header') || e.target.closest('.terminal-footer')) return;
    if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
    isTyping = false;
    startTerminal();
  });
  window.__restartTerminal = startTerminal;
  setTimeout(startTerminal, 800);
})();
</script>
</body>
