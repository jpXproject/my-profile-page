<style>
/* ============================================================
   PROFILE LINKS — 2026 (Linktree-style, mobile-first)
   ⚙️  EDIT MUDAH: semua konten & link diatur lewat CONFIG
       di bagian <script> (cari "CONFIG = {" di bawah).
   📸  FOTO: taruh file bernama photo.jpg di folder yang sama
       dengan file ini → otomatis dipakai di avatar + background.
   ============================================================ */

:root {
  --bg: #05050f;
  --card: rgba(20, 20, 40, 0.55);
  --card-border: rgba(255, 255, 255, 0.10);
  --text: #f2f2ff;
  --text-dim: #9ba3c4;
  --violet: #8b5cf6;
  --fuchsia: #e879f9;
  --cyan: #22d3ee;
  --grad-main: linear-gradient(135deg, #8b5cf6 0%, #e879f9 50%, #22d3ee 100%);
  --r-xl: 28px;
  --r-lg: 18px;
  --r-md: 14px;
  --shadow-card: 0 24px 60px -12px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.04) inset;
  --shadow-glow: 0 0 40px rgba(139,92,246,.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--bg);
  min-height: 100dvh;
  display: grid;
  place-items: center;
  overflow-x: hidden;
  padding: calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
}

/* ---------- 1. BACKGROUND LAYERS ---------- */
.bg-scene { position: fixed; inset: 0; z-index: -2; overflow: hidden; }

/* Foto blur (aktif otomatis kalau photo.jpg ada) */
.bg-photo {
  position: fixed; inset: -5%; z-index: -4;
  background-size: cover; background-position: center;
  filter: blur(32px) saturate(1.1) brightness(.75);
  opacity: 0;
  transition: opacity 1s ease;
  pointer-events: none;
}
.bg-photo::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(5,5,15,.55), rgba(5,5,15,.82));
}
body.has-photo .bg-photo { opacity: 1; }

/* Aurora mesh (tint warna 2026 di atas foto) */
.bg-mesh {
  position: absolute;
  width: 130vmax; height: 130vmax;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(circle at 20% 30%, rgba(139,92,246,.55), transparent 45%),
    radial-gradient(circle at 80% 20%, rgba(34,211,238,.42), transparent 42%),
    radial-gradient(circle at 65% 80%, rgba(232,121,249,.45), transparent 45%),
    radial-gradient(circle at 25% 85%, rgba(52,211,153,.30), transparent 40%);
  filter: blur(70px) saturate(1.25);
  animation: meshDrift 26s ease-in-out infinite alternate;
  transition: opacity .8s ease;
}
body.has-photo .bg-mesh { opacity: .4; }
@keyframes meshDrift {
  0%   { transform: translate(-50%,-50%) rotate(0deg) scale(1); }
  50%  { transform: translate(-46%,-54%) rotate(12deg) scale(1.12); }
  100% { transform: translate(-54%,-48%) rotate(-8deg) scale(.96); }
}

.dust { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.9), rgba(255,255,255,0) 70%); animation: floatUp linear infinite; opacity: 0; }
.dust:nth-child(1) { width: 5px; height: 5px; left: 12%; bottom: -8%; animation-duration: 14s; }
.dust:nth-child(2) { width: 3px; height: 3px; left: 28%; bottom: -6%; animation-duration: 19s; animation-delay: 3s; }
.dust:nth-child(3) { width: 7px; height: 7px; left: 55%; bottom: -10%; animation-duration: 22s; animation-delay: 6s; }
.dust:nth-child(4) { width: 4px; height: 4px; left: 74%; bottom: -5%; animation-duration: 16s; animation-delay: 1.5s; }
.dust:nth-child(5) { width: 6px; height: 6px; left: 90%; bottom: -9%; animation-duration: 25s; animation-delay: 8s; }
@keyframes floatUp {
  0%   { transform: translateY(0) translateX(0); opacity: 0; }
  12%  { opacity: .8; }
  100% { transform: translateY(-110vh) translateX(24px); opacity: 0; }
}

.bg-vignette { position: absolute; inset: 0; background: radial-gradient(circle at 50% 30%, transparent 42%, rgba(0,0,0,.6) 100%); }

/* ---------- 2. CARD ---------- */
.card {
  position: relative;
  width: 100%;
  max-width: 420px;
  background: var(--card);
  backdrop-filter: blur(22px) saturate(1.4);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  border: 1px solid var(--card-border);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  animation: cardIn .9s cubic-bezier(.22,1,.36,1) both;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(40px) scale(.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.card::before {
  content: "";
  position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
  background: linear-gradient(90deg, transparent, rgba(139,92,246,.9), rgba(34,211,238,.9), transparent);
  z-index: 3;
  animation: hairline 5s ease-in-out infinite;
}
@keyframes hairline {
  0%,100% { opacity: .35; transform: scaleX(.6); }
  50%     { opacity: 1;   transform: scaleX(1); }
}

/* ---------- 3. HEADER: AVATAR + IDENTITY ---------- */
.header { position: relative; padding: 34px 22px 8px; text-align: center; }

.avatar-wrap { position: relative; width: 112px; height: 112px; margin: 0 auto; }
.avatar-ring {
  position: absolute; inset: -6px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #8b5cf6, #22d3ee, #e879f9, #8b5cf6);
  animation: spinRing 6s linear infinite;
  filter: drop-shadow(0 0 14px rgba(139,92,246,.55));
}
@keyframes spinRing { to { transform: rotate(360deg); } }
.avatar {
  position: absolute; inset: 0;
  border-radius: 50%;
  background: #131328;
  display: grid; place-items: center;
  overflow: hidden;
  border: 4px solid rgba(5,5,15,.9);
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.avatar svg { width: 62%; height: 62%; }
.status-dot {
  position: absolute; right: 5px; bottom: 5px;
  width: 18px; height: 18px;
  background: #22c55e;
  border: 3px solid #0b0b1e;
  border-radius: 50%;
  z-index: 3;
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,.55), 0 0 12px rgba(34,197,94,.9); }
  50%     { box-shadow: 0 0 0 9px rgba(34,197,94,0),   0 0 12px rgba(34,197,94,.9); }
}

.name {
  margin-top: 18px;
  font-family: "Space Grotesk", sans-serif;
  font-size: clamp(1.45rem, 6vw, 1.75rem);
  font-weight: 700;
  letter-spacing: -.02em;
  background: linear-gradient(120deg, #fff 20%, var(--violet) 45%, var(--fuchsia) 65%, var(--cyan) 90%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  background-size: 200% auto;
  animation: shineText 6s linear infinite;
}
@keyframes shineText { to { background-position: 200% center; } }

.role-chip {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px;
  padding: 6px 14px;
  font-size: .76rem; font-weight: 500;
  letter-spacing: .04em; text-transform: uppercase;
  color: #cfe7ff;
  background: rgba(139,92,246,.16);
  border: 1px solid rgba(139,92,246,.4);
  border-radius: 999px;
}
.role-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 2s infinite; }

.status-line {
  margin-top: 10px;
  min-height: 22px;
  font-size: .88rem;
  color: var(--text-dim);
}
.status-line .caret { display: inline-block; width: 2px; height: 1em; background: var(--fuchsia); vertical-align: text-bottom; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.bio { margin-top: 12px; font-size: .86rem; line-height: 1.6; color: var(--text-dim); }

/* ---------- 4. LINK BUTTONS ---------- */
.links { padding: 20px 20px 0; display: flex; flex-direction: column; gap: 13px; }

.link-btn {
  position: relative;
  display: flex; align-items: center; gap: 13px;
  width: 100%;
  min-height: 58px;
  padding: 11px 16px;
  border-radius: var(--r-md);
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.10);
  color: var(--text);
  text-decoration: none;
  overflow: hidden;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .25s, border-color .25s, box-shadow .25s;
}
.link-btn:hover {
  background: rgba(255,255,255,.11);
  border-color: rgba(139,92,246,.45);
  transform: translateY(-2px) scale(1.01);
  box-shadow: 0 12px 30px -10px rgba(139,92,246,.5);
}
.link-btn:active { transform: scale(.97); }

.lb-icon {
  width: 38px; height: 38px; flex-shrink: 0;
  display: grid; place-items: center;
  border-radius: 12px;
  background: rgba(255,255,255,.08);
}
.lb-icon svg { width: 20px; height: 20px; fill: #dfe4ff; }

.lb-text { flex: 1; text-align: left; min-width: 0; }
.lb-title { display: block; font-weight: 600; font-size: .93rem; color: #fff; }
.lb-sub { display: block; margin-top: 2px; font-size: .73rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.lb-arrow { flex-shrink: 0; color: var(--text-dim); opacity: .55; transition: transform .25s, opacity .25s, color .25s; }
.link-btn:hover .lb-arrow { transform: translateX(4px); opacity: 1; color: #fff; }

/* Counter klik per tombol (muncul setelah ada klik pertama) */
.lb-count {
  flex-shrink: 0;
  display: none;
  align-items: center; gap: 4px;
  padding: 4px 9px;
  font-size: .68rem; font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: #cdd3f5;
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  white-space: nowrap;
}
.link-btn.featured .lb-count { background: rgba(255,255,255,.2); border-color: rgba(255,255,255,.28); }
.link-btn:hover .lb-count { border-color: rgba(139,92,246,.5); }
.lb-count.show { display: inline-flex; }
.lb-count.bump .lb-count-num { animation: countPop .45s cubic-bezier(.34,1.56,.64,1); }
@keyframes countPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.5); }
  100% { transform: scale(1); }
}

/* FEATURED (tombol utama referral) */
.link-btn.featured {
  min-height: 66px;
  background: var(--grad-main);
  border: none;
  animation: glowPulse 3s ease-in-out infinite;
}
.link-btn.featured::after { /* shine sweep */
  content: "";
  position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent);
  transform: skewX(-20deg);
  animation: sweep 3.4s ease-in-out infinite;
}
.link-btn.featured .lb-icon { background: rgba(255,255,255,.18); }
.link-btn.featured .lb-title { font-size: 1rem; }
.link-btn.featured .lb-sub { color: rgba(255,255,255,.88); }
.link-btn.featured:hover { transform: translateY(-2px) scale(1.015); filter: brightness(1.08); }
@keyframes glowPulse {
  0%,100% { box-shadow: 0 10px 30px -8px rgba(139,92,246,.7); }
  50%     { box-shadow: 0 10px 46px -6px rgba(232,121,249,.95); }
}
@keyframes sweep { 0%, 55% { left: -80%; } 85%, 100% { left: 140%; } }
.lb-badge {
  position: absolute; top: -11px; right: 14px; z-index: 2;
  padding: 3px 10px;
  font-size: .6rem; font-weight: 700; letter-spacing: .06em;
  color: #1a1205;
  background: linear-gradient(135deg, #fbbf24, #f97316);
  border-radius: 999px;
  box-shadow: 0 4px 12px rgba(251,191,36,.5);
}

/* Placeholder (slot kosong buat kamu isi) */
.link-btn.placeholder {
  min-height: 54px;
  border: 1.5px dashed rgba(255,255,255,.18);
  background: rgba(255,255,255,.02);
  justify-content: center;
  cursor: default;
  opacity: .75;
}
.link-btn.placeholder .lb-title { font-weight: 500; font-size: .8rem; color: var(--text-dim); }
.link-btn.placeholder:hover { transform: none; background: rgba(255,255,255,.04); border-color: rgba(139,92,246,.35); box-shadow: none; }

/* ---------- 5. SOCIAL ICON ROW ---------- */
.socials { display: flex; justify-content: center; gap: 12px; padding: 18px 20px 0; }
.social-btn {
  width: 46px; height: 46px;
  display: grid; place-items: center;
  border-radius: 14px;
  color: #cdd3f5;
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.09);
  text-decoration: none;
  transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .25s, box-shadow .25s, color .25s;
}
.social-btn svg { width: 20px; height: 20px; fill: currentColor; }
.social-btn:active { transform: scale(.9); }
.social-btn:hover { color: #fff; transform: translateY(-4px) scale(1.06); }
.social-btn.ig:hover { background: linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7); box-shadow: 0 8px 24px -6px rgba(238,42,123,.55); border-color: transparent; }
.social-btn.x:hover  { background: #0f0f16; box-shadow: 0 8px 24px -6px rgba(255,255,255,.25); border-color: rgba(255,255,255,.25); }
.social-btn.tt:hover { background: #0ea5e9; box-shadow: 0 8px 24px -6px rgba(14,165,233,.55); border-color: transparent; }
.social-btn.wa:hover { background: #25d366; box-shadow: 0 8px 24px -6px rgba(37,211,102,.55); border-color: transparent; }
.social-btn.yt:hover { background: #ff0033; box-shadow: 0 8px 24px -6px rgba(255,0,51,.55); border-color: transparent; }

/* ---------- 6. FOOTER ---------- */
.foot { padding: 16px 20px 18px; text-align: center; font-size: .72rem; color: rgba(155,163,196,.7); letter-spacing: .03em; }
.foot .clicks { display: inline-block; margin-top: 6px; color: rgba(155,163,196,.9); }
.foot #resetClicks {
  margin-left: 6px;
  background: none; border: none;
  color: rgba(155,163,196,.6);
  font-size: .66rem;
  font-family: inherit;
  text-decoration: underline;
  cursor: pointer;
  transition: color .2s;
}
.foot #resetClicks:hover { color: #f87171; }

/* ---------- RESPONSIVE / ACCESSIBILITY ---------- */
@media (max-width: 360px) {
  .links { padding: 16px 14px 0; }
  .header { padding: 28px 16px 8px; }
  .socials { gap: 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
}
</style>
</head>
<body>

<!-- BACKGROUND -->
<div class="bg-photo" id="bgPhoto" aria-hidden="true"></div>
<div class="bg-scene" aria-hidden="true">
  <div class="bg-mesh"></div>
  <span class="dust"></span><span class="dust"></span><span class="dust"></span>
  <span class="dust"></span><span class="dust"></span><span class="dust"></span>
  <div class="bg-vignette"></div>
</div>

<!-- ============ CARD ============ -->
<main class="card">

  <!-- Header: avatar + identitas -->
  <header class="header">
    <div class="avatar-wrap">
      <div class="avatar-ring"></div>
      <div class="avatar">
        <!-- Fallback ilustrasi; otomatis diganti foto kalau photo.jpg ada -->
        <img id="avatarImg" alt="Foto profil"
             src="data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='ag' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='24' r='13' fill='url(%23ag)' opacity='.95'/%3E%3Cpath d='M12 56c3-13 11-19 20-19s17 6 20 19' fill='url(%23ag)' opacity='.9'/%3E%3C/svg%3E" />
      </div>
      <span class="status-dot"></span>
    </div>

    <h1 class="name" id="nameEl">Jpx Project</h1>
    <span class="role-chip"><span class="dot"></span> <span id="roleEl">Creator · Builder</span></span>
    <p class="status-line" id="statusLine"></p>
    <p class="bio" id="bioEl"></p>
  </header>

  <!-- Link buttons (di-render dari CONFIG) -->
  <section class="links" id="linkList"></section>

  <!-- Social icons (di-render dari CONFIG) -->
  <section class="socials" id="socialList"></section>

  <footer class="foot">
    © 2026 · Dibuat dengan ♥ · Semua link penting di sini<br />
    <span class="clicks">👆 <b id="totalClicks">0</b> klik global · <button id="resetClicks" title="Reset tampilan lokal (angka global tetap)">reset lokal</button></span>
  </footer>
</main>

<script>
/* ============================================================
   ⚙️  CONFIG — EDIT DI SINI (semua konten & link ada di sini)
   ============================================================ */
const CONFIG = {
  title: "Jpx Project · Semua Link",
  name: "Jpx Project",
  role: "Creator · Builder · AI Enthusiast",
  bio: "Halo! Selamat datang di Jpx Project — semua link penting ada di bawah. Jangan lupa cek yang paling atas ya 😉",

  /* Kalimat bergantian di bawah nama (typing effect) */
  taglines: [
    "🚀 Klik tombol paling atas — AI coding GRATIS!",
    "Membuat sesuatu yang berguna ✦",
    "Semua link pentingku ada di sini 👇"
  ],

  /* FOTO (taruh di folder yang sama dengan file ini):
     - photoAvatar: buat avatar bulat — sudah aku crop persegi 512px
       dari image/1.jpeg jadi "avatar.jpg" ✅
     - photoBg: buat background blur — dari image/3.jpeg jadi "bg.jpg" ✅
     Kalau file tidak ada, otomatis pakai ilustrasi default / aurora. */
  photoAvatar: ["avatar.jpg", "photo.jpg", "1.jpeg", "2.webp"],
  photoBg: ["bg.jpg", "photo.jpg", "3.jpeg"],

  /* API counter klik GLOBAL (Cloudflare Worker + KV).
     Kosongkan ("") kalau mau matikan sinkron online & pakai lokal saja. */
  clicksApi: "https://jpx-click-counter.panx-je.workers.dev",

  /* Daftar tombol. Aturan:
     - featured: true  → tombol besar + glow (utama)
     - badge: "teks"   → badge di pojok kanan atas
     - placeholder: true → slot kosong bertanda putus-putus
     - icon: "gh" | "threads" | "ig" | "x" | "tt" | "wa" | "yt" */
  links: [
    {
      title: "🚀 AI Coding GRATIS — Coba Sekarang!",
      sub: "Build anything with AI · Free · No card needed",
      url: "https://freebuff.com/?ref=ref-7a6360b8-b763-4d64-b02f-10f39e8d9724",
      featured: true,
      badge: "⭐ Recommended"
    },
    { title: "GitHub", sub: "Kode & open-source project", url: "https://github.com/jpXproject", icon: "gh" },
    { title: "Threads", sub: "Pikiran & update harian", url: "https://threads.com/jepanx", icon: "threads" },
    { title: "TikTok", sub: "Konten & video harian 🎵", url: "https://tiktok.com/@oneal___", icon: "tt" }
  ],

  /* Ikon sosial kecil di bawah. Isi url masing-masing. */
  socials: [
    { icon: "ig", url: "https://instagram.com/jepanx" },
    { icon: "wa", url: "https://wa.me/6285749409040" },
    { icon: "yt", url: "https://www.youtube.com/jpxproject" }
  ]
};

/* ============================================================
   MESIN RENDER — jangan diubah kalau tidak perlu
   ============================================================ */

(() => {
  const $ = (s) => document.querySelector(s);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- Terapkan CONFIG ---- */
  document.title = CONFIG.title;
  $('#nameEl').textContent = CONFIG.name;
  $('#roleEl').textContent = CONFIG.role;
  $('#bioEl').textContent = CONFIG.bio;

  /* ---- Render link buttons ---- */
  const list = $('#linkList');
  CONFIG.links.forEach((l) => {
    const a = document.createElement('a');

    if (l.placeholder) {
      a.className = 'link-btn placeholder';
      a.innerHTML = '<span class="lb-title">＋ Slot link kamu — edit CONFIG di atas file</span>';
      list.appendChild(a);
      return;
    }

    a.className = 'link-btn' + (l.featured ? ' featured' : '');
    a.href = l.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.innerHTML =
      (l.badge ? `<span class="lb-badge">${l.badge}</span>` : '') +
      (l.icon ? `<span class="lb-icon">${ICONS[l.icon] || ''}</span>` : '<span class="lb-icon">🔗</span>') +
      `<span class="lb-text"><span class="lb-title">${l.title}</span>` +
      (l.sub ? `<span class="lb-sub">${l.sub}</span>` : '') + '</span>' +
      '<span class="lb-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>';
    list.appendChild(a);
  });

  /* ---- Render social icons ---- */
  const socials = $('#socialList');
  CONFIG.socials.forEach((s) => {
    const a = document.createElement('a');
    a.className = 'social-btn ' + s.icon;
    a.href = s.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.setAttribute('aria-label', s.icon);
    a.innerHTML = ICONS[s.icon] || '';
    socials.appendChild(a);
  });

  /* ---- Hitungan klik GLOBAL (Cloudflare Worker + KV) + fallback lokal ---- */
  const CLICKS_API = CONFIG.clicksApi || '';
  const LOCAL_KEY = 'jpx_link_clicks_local_v2';
  const totalEl = $('#totalClicks');

  const serverCounts = {};                 // angka global dari server
  const localAdd = loadLocal();            // tambahan lokal (fallback saat offline)

  function loadLocal() {
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; }
    catch { return {}; }
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(localAdd)); } catch {}
  }
  function shown(key) { return (serverCounts[key] || 0) + (localAdd[key] || 0); }
  function refreshTotal() {
    const sum = Object.keys(serverCounts).reduce((a, k) => a + shown(k), 0);
    if (totalEl) totalEl.textContent = sum.toLocaleString();
  }

  /* pasang counter + listener di tiap tombol link (bukan placeholder) */
  document.querySelectorAll('.link-btn:not(.placeholder)').forEach((a) => {
    const key = a.getAttribute('href') || a.textContent;
    const badge = document.createElement('span');
    badge.className = 'lb-count';
    badge.innerHTML = '👆 <span class="lb-count-num">0</span>';
    a.appendChild(badge);

    const update = () => {
      const n = shown(key);
      badge.querySelector('.lb-count-num').textContent = n.toLocaleString();
      badge.classList.toggle('show', n > 0);
    };
    const bump = () => {
      badge.classList.remove('bump');
      void badge.offsetWidth; // restart animasi pop
      badge.classList.add('bump');
    };

    a.addEventListener('click', () => {
      localAdd[key] = (localAdd[key] || 0) + 1; // optimis dulu, tampil cepat
      saveLocal();
      update(); bump(); refreshTotal();

      if (CLICKS_API) {
        fetch(CLICKS_API + '/api/click', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: key })
        }).then(r => r.json()).then((d) => {
          if (d && typeof d.count === 'number') {
            serverCounts[key] = d.count;
            delete localAdd[key]; // sudah direkonsiliasi dengan server
            saveLocal();
            update(); refreshTotal();
          }
        }).catch(() => { /* offline → biarkan hitungan lokal */ });
      }
    });
    update();
  });

  refreshTotal();

  /* ambil hitungan global dari server */
  if (CLICKS_API) {
    fetch(CLICKS_API + '/api/clicks').then(r => r.json()).then((d) => {
      if (d && d.counts) {
        Object.assign(serverCounts, d.counts);
        document.querySelectorAll('.link-btn:not(.placeholder)').forEach((a) => {
          const k = a.getAttribute('href') || a.textContent;
          const n = shown(k);
          a.querySelector('.lb-count-num').textContent = n.toLocaleString();
          a.querySelector('.lb-count').classList.toggle('show', n > 0);
        });
        refreshTotal();
      }
    }).catch(() => {});
  }

  /* reset tampilan lokal → kembali ke angka global server */
  const resetBtn = $('#resetClicks');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      try { localStorage.removeItem(LOCAL_KEY); } catch {}
      Object.keys(localAdd).forEach((k) => delete localAdd[k]);
      document.querySelectorAll('.lb-count').forEach((b) => {
        b.classList.remove('bump');
        b.querySelector('.lb-count-num').textContent = '0';
      });
      refreshTotal();
      if (CLICKS_API) {
        fetch(CLICKS_API + '/api/clicks').then(r => r.json()).then((d) => {
          if (d && d.counts) {
            Object.assign(serverCounts, d.counts);
            document.querySelectorAll('.link-btn:not(.placeholder)').forEach((a) => {
              const k = a.getAttribute('href') || a.textContent;
              const n = shown(k);
              a.querySelector('.lb-count-num').textContent = n.toLocaleString();
              a.querySelector('.lb-count').classList.toggle('show', n > 0);
            });
            refreshTotal();
          }
        }).catch(() => {});
      }
    });
  }

  /* ---- Foto: avatar + background blur, sumber terpisah (otomatis) ---- */
  const avatarImg = $('#avatarImg');
  function loadAvatar(i) {
    if (i >= CONFIG.photoAvatar.length) return; // fallback: ilustrasi default
    const img = new Image();
    img.onload = () => { avatarImg.src = CONFIG.photoAvatar[i]; };
    img.onerror = () => loadAvatar(i + 1);
    img.src = CONFIG.photoAvatar[i];
  }
  function loadBg(i) {
    if (i >= CONFIG.photoBg.length) return; // fallback: aurora mesh
    const img = new Image();
    img.onload = () => {
      $('#bgPhoto').style.backgroundImage = `url('${CONFIG.photoBg[i]}')`;
      document.body.classList.add('has-photo'); // fade-in bg
    };
    img.onerror = () => loadBg(i + 1);
    img.src = CONFIG.photoBg[i];
  }
  loadAvatar(0);
  loadBg(0);

  /* ---- Typing taglines ---- */
  const el = $('#statusLine');
  const phrases = CONFIG.taglines;
  let p = 0, c = 0, deleting = false;
  function typeLoop() {
    const word = phrases[p];
    el.innerHTML = word.slice(0, c) + '<span class="caret"></span>';
    if (!deleting && c < word.length) { c++; setTimeout(typeLoop, 42); }
    else if (!deleting) { deleting = true; setTimeout(typeLoop, 2400); }
    else if (c > 0) { c--; setTimeout(typeLoop, 20); }
    else { deleting = false; p = (p + 1) % phrases.length; setTimeout(typeLoop, 400); }
  }
  reduced ? (el.textContent = phrases[0]) : typeLoop();
})();
</script>
</body>
</html>
